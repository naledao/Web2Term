name: Build and deploy Go backend over SSH

on:
  push:
    branches: [main]
    paths:
      - 'backend/**'
      - '.github/workflows/backend-deploy.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: backend-production
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum

      - name: Build Linux amd64 binary
        working-directory: backend
        env:
          CGO_ENABLED: '0'
          GOOS: linux
          GOARCH: amd64
        run: |
          set -euo pipefail
          mkdir -p bin/deploy
          go build -mod=readonly -trimpath -ldflags='-s -w' -o bin/deploy/web2term-backend ./cmd/server
          cd bin/deploy
          sha256sum web2term-backend > web2term-backend.sha256
          printf '%s-%s-%s\n' "$GITHUB_SHA" "$GITHUB_RUN_ID" "$GITHUB_RUN_ATTEMPT" > release-id
          tar -czf ../backend-deploy.tar.gz web2term-backend web2term-backend.sha256 release-id

      - name: Upload deployment bundle
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: backend-deploy
          path: backend/bin/backend-deploy.tar.gz
          if-no-files-found: error
          retention-days: 7

  deploy:
    needs: build
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Download deployment bundle
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: backend-deploy
          path: deploy

      - name: Deploy over SSH
        env:
          DEPLOY_HOST: ${{ vars.BACKEND_SSH_HOST }}
          DEPLOY_PORT: ${{ vars.BACKEND_SSH_PORT }}
          DEPLOY_USER: ${{ vars.BACKEND_SSH_USER }}
          DEPLOY_KEY: ${{ secrets.BACKEND_SSH_PRIVATE_KEY }}
          DEPLOY_KNOWN_HOSTS: ${{ secrets.BACKEND_SSH_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          : "${DEPLOY_HOST:?Missing BACKEND_SSH_HOST variable}"
          : "${DEPLOY_PORT:?Missing BACKEND_SSH_PORT variable}"
          : "${DEPLOY_USER:?Missing BACKEND_SSH_USER variable}"
          : "${DEPLOY_KEY:?Missing BACKEND_SSH_PRIVATE_KEY secret}"
          : "${DEPLOY_KNOWN_HOSTS:?Missing BACKEND_SSH_KNOWN_HOSTS secret}"
          [[ "$DEPLOY_HOST" =~ ^[a-zA-Z0-9][a-zA-Z0-9.-]*$ ]]
          [[ "$DEPLOY_PORT" =~ ^[0-9]+$ ]]
          [[ "$DEPLOY_USER" =~ ^[a-z_][a-z0-9_-]*$ ]]
          ssh_dir="$(mktemp -d)"
          trap 'rm -f -- "$ssh_dir/id_ed25519" "$ssh_dir/known_hosts"; rmdir -- "$ssh_dir"' EXIT
          umask 077
          printf '%s\n' "$DEPLOY_KEY" > "$ssh_dir/id_ed25519"
          printf '%s\n' "$DEPLOY_KNOWN_HOSTS" > "$ssh_dir/known_hosts"
          unset DEPLOY_KEY DEPLOY_KNOWN_HOSTS
          ssh -T -p "$DEPLOY_PORT" -i "$ssh_dir/id_ed25519" \
            -o BatchMode=yes -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes \
            -o UserKnownHostsFile="$ssh_dir/known_hosts" -o ConnectTimeout=15 \
            -o ServerAliveInterval=15 -o ServerAliveCountMax=3 \
            "$DEPLOY_USER@$DEPLOY_HOST" deploy < deploy/backend-deploy.tar.gz
