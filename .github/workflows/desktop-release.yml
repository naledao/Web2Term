name: Build and Release Desktop

on:
  push:
    branches:
      - main

permissions:
  contents: write

concurrency:
  group: desktop-release-main
  cancel-in-progress: false

jobs:
  prepare-release:
    runs-on: ubuntu-latest
    environment: release-main
    outputs:
      version: ${{ steps.version.outputs.version }}
      commit: ${{ steps.version.outputs.commit }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.RELEASE_PUSH_TOKEN }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Bump patch version
        id: version
        run: |
          npm version patch --no-git-tag-version
          version="$(node -p "require('./package.json').version")"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json package-lock.json
          git commit -m "chore: bump version to v${version} [skip ci]"
          git push origin HEAD:main
          echo "version=${version}" >> "$GITHUB_OUTPUT"
          echo "commit=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

  build-windows:
    needs: prepare-release
    runs-on: windows-latest

    steps:
      - name: Checkout release commit
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.prepare-release.outputs.commit }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build Windows installer
        run: npm run dist:win

      - name: Prepare stable Windows download alias
        shell: pwsh
        env:
          VERSION: ${{ needs.prepare-release.outputs.version }}
        run: |
          Copy-Item `
            "release/Web2Term-Setup-$env:VERSION.exe" `
            "release/Web2Term-Setup.exe"

      - name: Upload Windows release assets
        uses: actions/upload-artifact@v4
        with:
          name: windows-release-assets
          if-no-files-found: error
          path: |
            release/Web2Term-Setup-${{ needs.prepare-release.outputs.version }}.exe
            release/Web2Term-Setup-${{ needs.prepare-release.outputs.version }}.exe.blockmap
            release/Web2Term-Setup.exe
            release/latest.yml

  build-macos:
    needs: prepare-release
    runs-on: macos-latest
    env:
      CSC_IDENTITY_AUTO_DISCOVERY: 'false'

    steps:
      - name: Checkout release commit
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.prepare-release.outputs.commit }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run macOS terminal regressions
        run: npm run test:mac

      - name: Build ad-hoc signed Apple Silicon DMG
        run: npm run dist:mac

      - name: Check macOS package integrity
        env:
          VERSION: ${{ needs.prepare-release.outputs.version }}
        run: |
          app_path="release/mac-arm64/Web2Term.app"
          codesign --verify --deep --strict --verbose=2 "$app_path"
          codesign --display --verbose=4 "$app_path"
          hdiutil verify "release/Web2Term-Setup-${VERSION}.dmg"

      - name: Prepare stable macOS download alias
        env:
          VERSION: ${{ needs.prepare-release.outputs.version }}
        run: cp "release/Web2Term-Setup-${VERSION}.dmg" "release/Web2Term.dmg"

      - name: Upload macOS release assets
        uses: actions/upload-artifact@v4
        with:
          name: macos-release-assets
          if-no-files-found: error
          path: |
            release/Web2Term-Setup-${{ needs.prepare-release.outputs.version }}.dmg
            release/Web2Term-Setup-${{ needs.prepare-release.outputs.version }}.dmg.blockmap
            release/Web2Term.dmg

  publish-release:
    needs:
      - prepare-release
      - build-windows
      - build-macos
    runs-on: ubuntu-latest

    steps:
      - name: Checkout release commit
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.prepare-release.outputs.commit }}
          fetch-depth: 0

      - name: Download release assets
        uses: actions/download-artifact@v4
        with:
          pattern: '*-release-assets'
          path: release-assets
          merge-multiple: true

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.prepare-release.outputs.version }}
          COMMIT: ${{ needs.prepare-release.outputs.commit }}
          RUN_NUMBER: ${{ github.run_number }}
        run: |
          tag="v${VERSION}"
          title="Web2Term v${VERSION} (build ${RUN_NUMBER})"
          git tag "$tag" "$COMMIT"
          git push origin "$tag"
          gh release create "$tag" \
            --title "$title" \
            --notes-file build/macos-installation.md \
            --generate-notes \
            release-assets/*

      - name: Keep only latest 3 releases
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release list --limit 100 --json tagName,createdAt \
            --jq 'sort_by(.createdAt) | reverse | .[3:] | .[].tagName' |
          while IFS= read -r old_tag; do
            [ -n "$old_tag" ] || continue
            echo "Deleting old release $old_tag"
            gh release delete "$old_tag" --yes
          done
