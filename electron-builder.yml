# Stable upgrade identity; the displayed product name is configured below.
appId: com.example.gptweb2codexterminal
productName: Web2Term

# Pin the artifact name so the file on disk, the path recorded in latest.yml,
# and the asset name on GitHub all match. Without it electron-builder writes
# spaces (disk) / hyphens (latest.yml) / dots (GitHub upload) and the updater
# 404s because it downloads the name latest.yml declares.
artifactName: Web2Term-Setup-${version}.${ext}

directories:
  buildResources: build
  output: release

# `out/` is produced by electron-vite. `node_modules` is needed because
# `externalizeDepsPlugin` deliberately does NOT bundle runtime dependencies 鈥?# ssh2 and its tree have to be on disk in the packaged app.
files:
  - out/**
  - package.json
  - node_modules/**
  - '!**/*.map'
  # Helper builds live under out/ but ship only as the Windows extraResource below, never inside app.asar.
  - '!out/windows-helper/**'
  - '!out/windows-helper-package/**'
  - '!out/windows-helper-offline-feed/**'
  - '!out/ripgrep/**'
  - '!node_modules/@vscode/ripgrep-universal/**'

asar: true
extraResources:
  - from: build/icon.png
    to: tray-icon.png
  # Only the target executable and its notices ship; all other architectures stay in the build tree.
  - from: out/ripgrep/${os}-${arch}
    to: ripgrep
# ssh2's native accelerators (cpu-features/nan) are OPTIONAL and were never built
# 鈥?npm's allow-scripts gate skips them, and the pure-JS path is what runs. So
# there is nothing to rebuild.
npmRebuild: false
# Checks bundled ripgrep on every platform and keeps the Windows helper completeness check.
afterPack: ./build/verify-package-resources.cjs

win:
  icon: build/icon.ico
  # Merged with the top-level extraResources for Windows only; macOS/Linux packages carry no helper.
  # Produced offline by `npm run helper:publish` (self-contained win-x64, no separate .NET install).
  extraResources:
    - from: out/windows-helper-package
      to: windows-helper
      filter:
        - '**/*'
        - '!**/*.pdb'
  target:
    - target: nsis
      arch:
        - x64

nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  createStartMenuShortcut: true

mac:
  # Re-sign the final bundle, including helpers and frameworks, without an
  # Apple Developer certificate. null would skip signing after packaging.
  # Ad-hoc signing does not provide Gatekeeper trust or Apple notarization.
  identity: '-'
  hardenedRuntime: true
  entitlements: build/entitlements.mac.plist
  entitlementsInherit: build/entitlements.mac.plist
  notarize: false
  target:
    - target: dmg
      arch:
        - arm64
  category: public.app-category.developer-tools

linux:
  target:
    - AppImage
  category: Development



publish:
  provider: github
  owner: naledao
  repo: Web2Term
